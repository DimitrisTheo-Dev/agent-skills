<!doctype html><html lang="en"><meta charset="utf-8"><title>Skill index — viewport inspection</title><style>body{margin:0;padding:20px;font:14px Arial;background:#ddd;color:#222}header{display:flex;gap:16px;align-items:center;margin-bottom:16px}button{padding:10px}iframe{display:block;background:white;border:1px solid #888;height:760px;transform-origin:top left}p{font-size:12px}.stage{height:780px}</style><header><strong>CSS viewport harness</strong><button data-width="390">390px</button><button data-width="760">760px</button><button data-width="1024">1024px</button><button data-width="1440">1440px</button><a href="index.html">Open direct page</a></header><p id="dimensions">390 CSS px · Browser viewport emulation, not a real device test.</p><div class="stage"><iframe title="Skill catalog at selected CSS width" src="index.html" width="390"></iframe></div><script>const frame=document.querySelector('iframe');document.querySelectorAll('button').forEach(b=>b.onclick=()=>{const width=+b.dataset.width;frame.width=width;const scale=Math.min(1,(innerWidth-40)/width);frame.style.transform='scale('+scale+')';document.querySelector('#dimensions').textContent=width+' CSS px · '+Math.round(scale*100)+'% display scale · Browser viewport emulation, not a real device test.'})</script></html>
