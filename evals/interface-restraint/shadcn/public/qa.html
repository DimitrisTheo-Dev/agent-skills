<!doctype html><html lang="en"><meta charset="utf-8"><title>Responsive checks</title><style>body{margin:24px;background:#e4e4e7;font:14px system-ui}header{display:flex;gap:24px;align-items:center;margin:0 0 24px}iframe{display:block;border:0;background:white;height:812px;max-width:none}label{display:flex;gap:8px}select{font:inherit}main{width:max-content;margin:auto}</style><header><label>Width<select id="width"><option>375</option><option>320</option><option>640</option><option>641</option><option>700</option><option>701</option><option>768</option><option>1024</option></select></label><label>Mode<select id="mode"><option value="normal">Normal</option><option value="blocked">Clipboard unavailable</option></select></label><span>CSS viewport checks, not native device tests.</span></header><main><iframe title="Skills preview" src="./" width="375" allow="clipboard-write"></iframe></main><script>const frame=document.querySelector('iframe');document.querySelector('#width').addEventListener('change',event=>frame.width=event.target.value);document.querySelector('#mode').addEventListener('change',event=>{frame.allow=event.target.value==='blocked'?"clipboard-write 'none'":"clipboard-write";frame.src='./';});</script></html>
