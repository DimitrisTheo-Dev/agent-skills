<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Skills</title><link rel="stylesheet" href="styles.css"><script defer src="skills.js"></script><script defer src="app.js"></script></head>
<body>
<a class="skip" href="#detail">Skip to selected skill</a>
<div class="workspace">
<header class="bar"><a class="brand" href="#" aria-label="All skills">Skills</a><button class="icon-button" id="theme" aria-label="Switch to dark appearance"></button></header>
<div class="panes"><aside class="library" aria-label="Skill library"><div class="search-box"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.34-4.34" /> <circle cx="11" cy="11" r="8" /></svg><label class="sr-only" for="search">Search skills</label><input id="search" type="search" placeholder="Search skills" autocomplete="off"><kbd aria-hidden="true">/</kbd></div><div class="filters" aria-label="Filter skills"><button data-filter="all" aria-pressed="true">All</button><button data-filter="design" aria-pressed="false">Design</button><button data-filter="writing" aria-pressed="false">Writing</button><button data-filter="agents" aria-pressed="false">Agents</button></div><nav id="results" aria-label="Skills"></nav><div class="empty" id="empty" hidden><strong>No skills found</strong><p>Try another word or clear your filters.</p><button id="reset">Clear filters</button></div><p id="count" class="count" role="status"></p></aside>
<main id="detail" tabindex="-1"></main></div></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<dialog id="manual-dialog" aria-labelledby="manual-title"><div class="dialog-heading"><h2 id="manual-title">Copy this text</h2><form method="dialog"><button class="icon-button" aria-label="Close">×</button></form></div><p>Clipboard access is unavailable. Select the text and copy it with your device.</p><label class="sr-only" for="manual-text">Text to copy</label><textarea id="manual-text" readonly rows="4"></textarea><button id="select-text" class="primary">Select text</button></dialog>
<noscript>This library requires JavaScript to display the skills.</noscript>
</body></html>
