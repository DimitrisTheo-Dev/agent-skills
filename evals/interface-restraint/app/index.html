<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Skills</title><link rel="stylesheet" href="styles.css"><script defer src="skills.js"></script><script defer src="app.js"></script></head>
<body>
<a class="skip" href="#detail">Skip to selected skill</a>
<div class="workspace">
<header class="bar"><a class="brand" href="#" aria-label="All skills"><svg class="brand-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><path d="M14 17.5h7M17.5 14v7"/></svg> Skills</a><div class="bar-actions"><a class="icon-button" href="https://github.com/DimitrisTheo-Dev/agent-skills" target="_blank" rel="noreferrer" aria-label="Open GitHub repository" title="GitHub repository"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 19c-4 1-4-2-6-2m12 5v-4a3.5 3.5 0 0 0-1-2.8c3.3-.4 6.7-1.6 6.7-7.2A5.6 5.6 0 0 0 19.2 4a5.2 5.2 0 0 0-.2-4s-1.3-.4-4.3 1.6a14.7 14.7 0 0 0-7.4 0C4.3-.4 3 0 3 0a5.2 5.2 0 0 0-.2 4A5.6 5.6 0 0 0 1.3 8c0 5.6 3.4 6.8 6.7 7.2A3.5 3.5 0 0 0 7 18v4" transform="translate(2 2) scale(.83)"/></svg></a><button class="icon-button" id="theme" aria-label="Switch to dark appearance"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 13A8.5 8.5 0 0 1 11 3.5 8.5 8.5 0 1 0 20.5 13Z"/></svg></button></div></header>
<div class="panes"><aside class="library" aria-label="Skill library"><div class="search-box"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg><label class="sr-only" for="search">Search skills</label><input id="search" type="search" placeholder="Search skills" autocomplete="off"><kbd aria-hidden="true">/</kbd></div><div class="filters" aria-label="Filter skills"><button data-filter="all" aria-pressed="true">All</button><button data-filter="design" aria-pressed="false">Design</button><button data-filter="writing" aria-pressed="false">Writing</button><button data-filter="agents" aria-pressed="false">Agents</button></div><nav id="results" aria-label="Skills"></nav><div class="empty" id="empty" hidden><strong>No skills found</strong><p>Try another word or clear your filters.</p><button id="reset">Clear filters</button></div><p id="count" class="count" role="status"></p></aside>
<main id="detail" tabindex="-1"></main></div></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<dialog id="manual-dialog" aria-labelledby="manual-title"><div class="dialog-heading"><h2 id="manual-title">Copy this text</h2><form method="dialog"><button class="icon-button" aria-label="Close">×</button></form></div><p>Clipboard access is unavailable. Select the text and copy it with your device.</p><label class="sr-only" for="manual-text">Text to copy</label><textarea id="manual-text" readonly rows="4"></textarea><button id="select-text" class="primary">Select text</button></dialog>
<noscript>This library requires JavaScript to display the skills.</noscript>
</body></html>
